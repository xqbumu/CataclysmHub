name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy -p hub-core --all-targets --locked -- -D warnings
      - run: cargo test -p hub-core --locked
      - run: python -m unittest discover -s scripts/acceptance -p "test_*.py"
      - run: python -m unittest discover -s scripts/development -p "test_*.py"
      - run: cargo run -p hub-core --bin export-bindings --locked
      - run: git diff --exit-code -- apps/desktop/src/bindings
  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cargo check -p cataclysm-hub --locked
